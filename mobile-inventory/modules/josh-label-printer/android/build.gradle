apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.seznik.joshlabelprinter'
version = '1.0.0'

android {
  namespace 'com.seznik.joshlabelprinter'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '2.0.21')}"
  // Vendored DothanTech/Josh label-printer SDK — not published to any Maven repo.
  implementation files('libs/LPAPI.jar')
}
