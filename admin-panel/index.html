<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/seznik_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seznik Admin Panel — Live Telemetry</title>
    <meta name="description" content="Seznik Admin Panel: Real-time user analytics, login tracking, section heatmaps, and geolocation telemetry." />
    <!--
      Blocking theme-init script: runs synchronously before first paint.
      Reads localStorage and applies .dark to <html> immediately,
      preventing the white flash on reload in dark mode (FOUC fix).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
