name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------
  # 1. CI JOB: Test, Lint & Validate Build
  # ---------------------------------------------------
  ci-backend:
    name: Backend & Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Validate Backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seznik_db"
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Install & Validate Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # ---------------------------------------------------
  # 2. CD JOB: Automatic AWS Server Deployment
  # ---------------------------------------------------
  cd-backend:
    name: Deploy to AWS EC2
    needs: ci-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Verify AWS Secrets Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.AWS_EC2_HOST }}" ]; then
            echo "SECRETS_SET=false" >> $GITHUB_ENV
            echo "⚠️ AWS_EC2_HOST secret is not configured yet in GitHub Secrets."
            echo "Add AWS_EC2_HOST, AWS_EC2_USERNAME, and AWS_SSH_PRIVATE_KEY to GitHub Repository Secrets to enable automatic deployment to EC2."
          else
            echo "SECRETS_SET=true" >> $GITHUB_ENV
            echo "✅ AWS secrets detected. Proceeding to SSH deployment."
          fi

      - name: SSH & Deploy to AWS EC2 Instance
        if: env.SECRETS_SET == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Connecting to AWS EC2 instance..."
            cd ${{ secrets.AWS_APP_DIR || '/var/www/inventorymanager' }}
            
            echo "📥 Pulling latest backend changes from GitHub..."
            git pull origin main
            
            echo "📦 Installing production dependencies..."
            cd backend
            npm ci --omit=dev
            
            echo "🔄 Generating Prisma Client & Running DB Migrations..."
            npx prisma generate
            npx prisma migrate deploy || true
            
            echo "🔨 Building TypeScript..."
            npm run build
            
            echo "⚡ Reloading backend application with PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            
            echo "✅ Live Backend Deployment Successful!"
