name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------
  # 1. CI JOB: Test, Lint & Validate Build
  # ---------------------------------------------------
  ci-backend:
    name: Backend & Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Validate Backend
        env:
          NODE_ENV: development
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/seznik_db"
        run: |
          cd backend
          npm install --include=dev
          npx prisma generate
          npm run build

      - name: Install & Validate Frontend
        env:
          NODE_ENV: development
        run: |
          cd frontend
          npm install --include=dev
          npm run build

  # ---------------------------------------------------
  # 2. CD JOB: Automatic AWS Server Deployment
  # ---------------------------------------------------
  cd-backend:
    name: Deploy to AWS EC2
    needs: ci-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.AWS_EC2_HOST != ''
    runs-on: ubuntu-latest

    steps:
      - name: SSH & Deploy to AWS EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Connecting to AWS EC2 instance..."
            cd ${{ secrets.AWS_APP_DIR || '/var/www/inventorymanager' }}
            
            echo "📥 Pulling latest changes from GitHub..."
            git pull origin main
            
            echo "📦 Installing dependencies & building backend..."
            cd backend
            npm install --include=dev
            npx prisma generate
            npx prisma migrate deploy || true
            npm run build
            
            echo "⚡ Reloading backend application with PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            
            echo "✅ Live Backend Deployment Successful!"
